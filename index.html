
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutorial Center QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #183b56;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #reader video {
      transform: scaleX(-1) !important;
      -webkit-transform: scaleX(-1) !important;
    }

    #reader canvas {
      transform: none !important;
    }

    #status {
      color: #183b56;
      font-weight: bold;
    }

    .instruction {
      font-size: 14px;
      color: #667085;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Tutorial Center</h2>

    <p id="scannerTitle">QR Code Scanner</p>

    <div id="reader"></div>

    <p class="instruction" id="instruction">
      Position the QR code inside the scanning box.
    </p>

    <p id="status">Starting camera...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const scanMode = params.get("mode");

    const html5QrCode = new Html5Qrcode("reader");

    let isProcessing = false;

    const config = {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    };

    function initializePage() {
      if (scanMode !== "employee" && scanMode !== "student") {
        document.getElementById("status").textContent =
          "Please open the scanner from the attendance system.";
        return false;
      }

      const title = scanMode === "employee"
        ? "Employee QR Code Scanner"
        : "Student QR Code Scanner";

      document.getElementById("scannerTitle").textContent = title;

      document.getElementById("instruction").textContent =
        "Position the " + scanMode +
        " QR code inside the scanning box.";

      return true;
    }

    async function startScanner() {
      if (!initializePage()) return;

      try {
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("No camera detected.");
        }

        const selectedCamera =
          cameras.find(camera =>
            /back|rear|environment/i.test(camera.label)
          ) || cameras[0];

        await html5QrCode.start(
          selectedCamera.id,
          config,
          onScanSuccess
        );

        document.getElementById("status").textContent =
          "Camera ready. Scan a " + scanMode + " QR code.";

      } catch (error) {
        document.getElementById("status").textContent =
          "Unable to access camera. Please allow camera permission and reload.";

        console.error(error);
      }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;

      let person;

      try {
        person = JSON.parse(decodedText);
      } catch (error) {
        document.getElementById("status").textContent =
          "Invalid QR code. Please scan a valid " + scanMode + " QR code.";
        return;
      }

      let id;
      let name;
      let message;

      if (scanMode === "employee") {
        id = person["ID Number"];
        name = person["Name"];
        message = "EMPLOYEE_QR_SCANNED";
      } else {
        id = person["Student ID"];
        name = person["Student Name"];
        message = "STUDENT_QR_SCANNED";
      }

      if (!id || !name) {
        document.getElementById("status").textContent =
          "Invalid " + scanMode + " QR code.";
        return;
      }

      isProcessing = true;

      document.getElementById("status").textContent =
        scanMode + " QR code detected!";

      try {
        await html5QrCode.stop();

        if (window.opener && !window.opener.closed) {

          const scannedPerson = scanMode === "employee"
            ? {
                "ID Number": String(id).trim(),
                "Name": String(name).trim()
              }
            : {
                "Student ID": String(id).trim(),
                "Student Name": String(name).trim()
              };

          const data = scanMode === "employee"
            ? { employee: scannedPerson }
            : { student: scannedPerson };

          window.opener.postMessage({
            type: message,
            ...data,
            scannedAt: new Date().toISOString()
          }, "*");

          document.getElementById("status").textContent =
            "QR information sent successfully!";

          setTimeout(() => window.close(), 1000);

        } else {
          document.getElementById("status").textContent =
            "Please open the scanner from the attendance system.";

          isProcessing = false;
        }

      } catch (error) {
        document.getElementById("status").textContent =
          "Unable to process QR code. Please reload.";

        console.error(error);
        isProcessing = false;
      }
    }

    window.addEventListener("load", startScanner);
  </script>

</body>
</html>
