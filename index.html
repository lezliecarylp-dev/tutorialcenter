
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Tutorial Center QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #183b56;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #status {
      color: #667085;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Tutorial Center</h2>
    <p>Employee QR Code Scanner</p>

    <div id="reader"></div>

    <p id="status">Starting camera...</p>
  </div>

  <script>
    const html5QrCode = new Html5Qrcode("reader");

    let isProcessing = false;

    const config = {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    };

    async function startScanner() {
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess
        );

        document.getElementById("status").textContent =
          "Camera ready. Point it at an employee QR code.";

      } catch (error) {
        try {
          const cameras = await Html5Qrcode.getCameras();

          if (!cameras || cameras.length === 0) {
            throw new Error("No camera was detected.");
          }

          await html5QrCode.start(
            cameras[0].id,
            config,
            onScanSuccess
          );

          document.getElementById("status").textContent =
            "Camera ready. Point it at an employee QR code.";

        } catch (fallbackError) {
          document.getElementById("status").textContent =
            "Unable to access camera. Allow camera permission and reload this page.";
        }
      }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;

      let employee;

      try {
        employee = JSON.parse(decodedText);
      } catch (error) {
        document.getElementById("status").textContent =
          "Invalid QR code. Please scan an employee QR code.";
        return;
      }

      if (
        !employee ||
        !employee["ID Number"] ||
        !employee["Name"]
      ) {
        document.getElementById("status").textContent =
          "QR code is missing employee ID or Name.";
        return;
      }

      isProcessing = true;

      document.getElementById("status").textContent =
        "Employee QR code detected!";

      try {
        await html5QrCode.stop();

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: "EMPLOYEE_QR_SCANNED",
            employee: {
              "ID Number": String(employee["ID Number"]).trim(),
              "Name": String(employee["Name"]).trim()
            },
            scannedAt: new Date().toISOString()
          }, "*");

          document.getElementById("status").textContent =
            "Employee information sent. You may close this window.";

          setTimeout(function() {
            window.close();
          }, 1000);

        } else {
          document.getElementById("status").textContent =
            "Attendance page not found. Please open the scanner from the attendance page.";
        }

      } catch (error) {
        document.getElementById("status").textContent =
          "Unable to process QR code. Please reload the page.";
      }
    }

    window.addEventListener("load", startScanner);
  </script>

</body>
</html>
